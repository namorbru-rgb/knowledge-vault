name: Family Hub checks
on:
  pull_request:
  push:
    branches: ['codex/**']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and commit audited backend lockfile
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/backend-dependency-audit-20261121'
        run: |
          npm install --package-lock-only --prefix backend
          npm audit fix --prefix backend
          npm audit --prefix backend --omit=dev
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): regenerate audited backend lockfile"
            git push origin HEAD:fix/backend-dependency-audit-20261121
          fi
      - run: npm ci
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run build
      - run: npm audit --prefix backend --omit=dev
      - run: npm audit --prefix frontend --omit=dev
