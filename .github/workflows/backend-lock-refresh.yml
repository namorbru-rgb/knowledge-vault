name: Regenerate secure backend dependency lock
on:
  push:
    branches:
      - fix/backend-dependency-audit-20261121
permissions:
  contents: write
jobs:
  refresh-lock:
    if: github.repository == 'namorbru-rgb/knowledge-vault'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Update lockfile and safe compatible dependencies
        run: |
          npm install --package-lock-only --prefix backend
          npm audit fix --prefix backend
      - name: Check production dependencies
        run: npm audit --prefix backend --omit=dev
      - name: Run backend install and repository tests
        run: |
          npm ci --prefix backend
          npm ci
          npm ci --prefix frontend
          npm test
          npm run build
      - name: Commit regenerated backend lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/package.json backend/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): refresh backend lockfile with audited dependencies"
            git push origin HEAD:fix/backend-dependency-audit-20261121
          fi
